name: Monthly console check

on:
  schedule:
    - cron: '17 15 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: monthly-console-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test .github/scripts/console-check.test.js
      - run: npm install --no-save --no-package-lock playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Check production site
        id: check
        continue-on-error: true
        run: node .github/scripts/check-console.js
      - name: Report findings
        if: always() && steps.check.outcome != 'skipped'
        uses: actions/github-script@v7
        with:
          script: |
            await require('./.github/scripts/report-console.js')({ github, context })
      - name: Fail if the check could not complete
        if: steps.check.outcome == 'failure'
        run: exit 1
