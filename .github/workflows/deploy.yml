# .github/workflows/deploy.yml
name: Deploy
on:
    push:
        branches:
            - main

concurrency:
  group: 'pages'
  cancel-in-progress: true
  
jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Inject tokens
              env:
                APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
                GOOGLE_TOKEN: ${{ secrets.GOOGLE_TOKEN }}
                SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
                SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
                SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
              run: |
                sed -i "s|__APIFY_TOKEN__|$(printf '%s' "$APIFY_TOKEN" | sed 's/[|&\\]/\\&/g')|g" map.js 19hz/map.js
                sed -i "s|__GOOGLE_TOKEN__|$(printf '%s' "$GOOGLE_TOKEN" | sed 's/[|&\\]/\\&/g')|g" map.js 19hz/map.js
                sed -i "s|__GOOGLE_TOKEN__|$(printf '%s' "$GOOGLE_TOKEN" | sed 's/[|&\\]/\\&/g')|g" index.html 19hz/index.html
                sed -i "s|__SPOTIFY_CLIENT_ID__|$(printf '%s' "$SPOTIFY_CLIENT_ID" | sed 's/[|&\\]/\\&/g')|g" 19hz/map.js
                sed -i "s|__SPOTIFY_CLIENT_SECRET__|$(printf '%s' "$SPOTIFY_CLIENT_SECRET" | sed 's/[|&\\]/\\&/g')|g" 19hz/map.js
                sed -i "s|__SENTRY_DSN__|$(printf '%s' "$SENTRY_DSN" | sed 's/[|&\\]/\\&/g')|g" index.html 19hz/index.html
            - uses: JamesIves/github-pages-deploy-action@v4
              with:
                  folder: .
                  branch: gh-pages
                  clean-exclude: preview
                  force: false
