name: Update 19hz venues

on:
  workflow_dispatch:
    inputs:
      force:
        description: Re-geocode all venues, including those with existing coordinates
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-19hz-venues
  cancel-in-progress: false

jobs:
  update-venues:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Extract and geocode venues
        working-directory: 19hz/scripts
        env:
          FORCE_GEOCODING: ${{ inputs.force }}
        run: |
          node extract-venues.js
          geocode_arguments=()
          if [ "$FORCE_GEOCODING" = "true" ]; then
            geocode_arguments+=(--force)
          fi
          node geocode-venues.js "${geocode_arguments[@]}"
      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/update-19hz-venues
          base: main
          add-paths: 19hz/venues.json
          commit-message: Update 19hz venues
          title: Update 19hz venues
          body: Updates the 19hz venue data using the extraction and geocoding scripts.
