name: Deploy PR previews
concurrency: preview-${{ github.ref }}
on:
    pull_request:
        types:
            - opened
            - reopened
            - synchronize
            - closed
jobs:
    deploy-preview:
        runs-on: ubuntu-latest
        steps:    
            - uses: actions/checkout@v7
            - name: Inject tokens
              if: github.event.action != 'closed'
              env:
                APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
                GOOGLE_TOKEN: ${{ secrets.GOOGLE_TOKEN }}
                SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
                SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
                SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
              run: |
                sed -i "s|__APIFY_TOKEN__|$(printf '%s' "$APIFY_TOKEN" | sed 's/[|&\\]/\\&/g')|g" map.js 19hz/map.js
                sed -i "s|__GOOGLE_TOKEN__|$(printf '%s' "$GOOGLE_TOKEN" | sed 's/[|&\\]/\\&/g')|g" map.js 19hz/map.js
                sed -i "s|__GOOGLE_TOKEN__|$(printf '%s' "$GOOGLE_TOKEN" | sed 's/[|&\\]/\\&/g')|g" index.html 19hz/index.html
                sed -i "s|__SPOTIFY_CLIENT_ID__|$(printf '%s' "$SPOTIFY_CLIENT_ID" | sed 's/[|&\\]/\\&/g')|g" 19hz/map.js
                sed -i "s|__SPOTIFY_CLIENT_SECRET__|$(printf '%s' "$SPOTIFY_CLIENT_SECRET" | sed 's/[|&\\]/\\&/g')|g" 19hz/map.js
                sed -i "s|__SENTRY_DSN__|$(printf '%s' "$SENTRY_DSN" | sed 's/[|&\\]/\\&/g')|g" index.html 19hz/index.html
            - uses: rossjrw/pr-preview-action@v1
              with:
                  source-dir: .
                  preview-branch: gh-pages
                  umbrella-dir: preview
                  action: auto
                  wait-for-pages-deployment: true
                  comment: true
                  qr-code: false
